[project]
name = "niwrap_ants"
version = "2.5.3"
description = "Advanced Normalization Tools (ANTs) computes high-dimensional mappings to capture the statistics of brain structure and function. It is a state-of-the-art medical image registration and segmentation toolkit that allows one to organize, visualize, and statistically explore large biomedical image sets. ANTs integrates imaging modalities in space and time and works across species or organ systems with minimal customization. It has won several international, unbiased competitions such as MICCAI, BRATS, and STACOM."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Brian B. Avants" }, { name = "Nicholas J. Tustison" }, { name = "Gang Song" }, { name = "James C. Gee" }, { name = "Philip A. Cook" }]
requires-python = ">=3.10"
dependencies = [
  "styxdefs>=0.7.0,<0.8.0",
]

[tool.setuptools]
packages = ["ants"]
package-dir = { "ants" = "." }

[tool.setuptools.package-data]
"ants" = ["py.typed"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
