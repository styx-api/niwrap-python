[project]
name = "niwrap_freesurfer"
version = "7.4.1"
description = "FreeSurfer is a software package for the analysis and visualization of neuroimaging data from cross-sectional and longitudinal studies, developed by the Laboratory for Computational Neuroimaging at the Martinos Center for Biomedical Imaging. It provides full processing streams for structural and functional MRI, including cortical surface reconstruction, cortical and subcortical segmentation, cortical thickness estimation, linear and nonlinear registration, diffusion MRI, PET analysis, and statistical analysis of group morphometry. FreeSurfer is the structural MRI analysis software of choice for the Human Connectome Project."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bruce Fischl" }, { name = "Anders M. Dale" }, { name = "Martin I. Sereno" }]
requires-python = ">=3.10"
dependencies = [
  "styxdefs>=0.7.0,<0.8.0",
]

[tool.setuptools]
packages = ["freesurfer"]
package-dir = { "freesurfer" = "." }

[tool.setuptools.package-data]
"freesurfer" = ["py.typed"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
