[project]
name = "niwrap_niftyreg"
version = "0.9.4"
description = "NiftyReg is an open-source medical image registration toolkit that provides tools for rigid, affine, and non-linear registration of medical images. It implements a block-matching approach (reg_aladin) for global registration and a fast free-form deformation algorithm based on cubic B-splines (reg_f3d) for non-linear registration, with both CPU and GPU implementations. NiftyReg was developed at the Centre for Medical Image Computing (CMIC) at University College London."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marc Modat" }, { name = "Pankaj Daga" }, { name = "M. Jorge Cardoso" }, { name = "David Cash" }, { name = "Sebastien Ourselin" }]
requires-python = ">=3.10"
dependencies = [
  "styxdefs>=0.7.0,<0.8.0",
]

[tool.setuptools]
packages = ["niftyreg"]
package-dir = { "niftyreg" = "." }

[tool.setuptools.package-data]
"niftyreg" = ["py.typed"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
