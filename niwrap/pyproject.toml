[project]
name = "niwrap"
version = "0.9.4"
description = "Neuroimaging wrappers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "CMI DAIR" }]
requires-python = ">=3.10"
dependencies = [
  "styxdocker",
  "styxsingularity",
  "styxgraph",
  "niwrap_afni",
  "niwrap_ants",
  "niwrap_c3d",
  "niwrap_dcm2niix",
  "niwrap_fastsurfer",
  "niwrap_freesurfer",
  "niwrap_fsl",
  "niwrap_greedy",
  "niwrap_mrtrix",
  "niwrap_mrtrix3tissue",
  "niwrap_niftyreg",
  "niwrap_workbench",
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
